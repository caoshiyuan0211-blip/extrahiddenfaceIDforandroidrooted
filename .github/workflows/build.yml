name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download FaceNet model
        run: |
          mkdir -p app/src/main/assets
          curl -sSL -o app/src/main/assets/facenet.tflite \
            "https://raw.githubusercontent.com/pillarpond/face-recognizer-android/master/app/src/main/assets/facenet.tflite"
          echo "b8b51d171c4086088b607098d1c30290  app/src/main/assets/facenet.tflite" | md5sum -c -

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facelock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
